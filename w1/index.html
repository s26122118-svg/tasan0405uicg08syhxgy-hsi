<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 引入 FontAwesome 圖示庫（用於 IG 與 Email 圖示） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 連結外部 CSS 樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 名片容器 -->
    <div class="card">
        <!-- 1. 圓形大頭貼照片 -->
        <img src="https://picsum.photos/200?grayscale" alt="個人大頭貼" class="avatar">

        <!-- 2. 名字與一行簡短自我介紹 -->
        <h1 class="name">劉玉恩</h1>
        <p class="bio">追求極簡美學與極致體驗的視覺創作者。</p>

        <!-- 3. 下方兩個按鈕 (Instagram 和 Email) -->
        <div class="btn-group">
            <a href="https://www.instagram.com/_xduje_?vrfl=MWR3eWhqcHFyYzN5bA%3D%3D&utm_source=qr" target="_blank" class="btn btn-instagram">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="mailto:your-email@example.com" class="btn btn-email">
                <i class="fas fa-envelope"></i> Email
            </a>
        </div>
    </div>

</body>
</html>
